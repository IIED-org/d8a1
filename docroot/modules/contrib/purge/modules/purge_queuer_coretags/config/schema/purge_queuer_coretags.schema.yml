# Schema for the configuration files of the Purge module.
purge_queuer_coretags.settings:
  type: config_object
  label: 'Core Tags Queuer settings.'
  mapping:
    blacklist:
      label: 'A list of strings; tags containing any of them are not queued.'
      type: sequence
      translatable: false
      sequence:
        type: string
        label: 'String that, when found anywhere in a tag, excludes it from the queue.'
        translatable: false
