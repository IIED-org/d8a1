###################################################################################
# The previous-major jobs default to $CORE_PREVIOUS_PHP_MIN (PHP 8.1), whose
# Debian bullseye images no longer have working apt repositories. Run them on
# PHP 8.3 instead; the phpstan and phpunit previous-major jobs inherit this.
composer (previous major):
  variables:
    PHP_VERSION: '8.3'
